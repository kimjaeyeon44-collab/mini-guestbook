<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 방명록</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    input, textarea, button { padding: 10px; font-size: 16px; }
    button { background: #ffca28; border: none; font-weight: bold; cursor: pointer; }
    .entry { border-bottom: 1px solid #ddd; padding: 12px 0; }
    .nickname { font-weight: bold; margin-bottom: 4px; }
    .date { font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <h2>📝 실시간 방명록</h2>
  <form id="guestbook-form">
    <input type="text" id="nickname" placeholder="닉네임" required maxlength="15">
    <textarea id="message" placeholder="짧은 메시지를 남겨주세요" required rows="3"></textarea>
    <button type="submit">등록하기</button>
  </form>
  <div id="guestbook-list">불러오는 중...</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
